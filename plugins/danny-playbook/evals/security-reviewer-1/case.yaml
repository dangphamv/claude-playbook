schema_version: "1.1"
name: security-reviewer-1
description: pb-security-reviewer finds the seeded defects in its fixture
tags: [pb-security-reviewer]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  timeout_seconds: 900
  allowed_tools: [Agent, Read, Glob, Grep]
graders:
  - name: delegated-to-pb-security-reviewer
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:[\w-]+:)?pb-security-reviewer"'
    weight: 2
  - name: s1-sql-injection
    type: regex
    pattern: 'SQL injection|injection'
    flags: i
  - name: s2-idor-bola
    type: regex
    pattern: 'IDOR|BOLA|ownership'
    flags: i
  - name: s3-mass-assignment
    type: regex
    pattern: 'mass assignment'
    flags: i
  - name: s4-ssrf
    type: regex
    pattern: 'SSRF'
    flags: i
  - name: s5-alg-none
    type: regex
    pattern: 'none'
    flags: i
  - name: s6-fallback-secret
    type: regex
    pattern: 'dev-secret|fallback'
    flags: i
  - name: s7-password-in-logs
    type: regex
    pattern: 'log'
    flags: i
  - name: s8-enumeration
    type: regex
    pattern: 'enumerat'
    flags: i
  - name: s9-timing-safe-raw-body
    type: regex
    pattern: 'timingSafeEqual|constant-time|raw'
    flags: i
  - name: s10-replay-idempotency
    type: regex
    pattern: 'replay|idempot'
    flags: i
  - name: s11-rate-limit
    type: regex
    pattern: 'rate limit|rate-limit'
    flags: i
