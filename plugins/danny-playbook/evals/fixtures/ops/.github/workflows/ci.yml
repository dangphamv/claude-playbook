name: ci
on:
  pull_request_target:
  push:
    branches: [main]
permissions: write-all
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with: { ref: "${{ github.event.pull_request.head.sha }}" }
      - run: echo "Building ${{ github.event.pull_request.title }}"
      - run: curl -fsSL https://get.example-tools.sh | bash
      - run: npm install && npm run build
      - run: docker build -t registry.example.com/app:latest . && docker push registry.example.com/app:latest
        env: { DOCKER_PASSWORD: "${{ secrets.DOCKER_PASSWORD }}" }
      - run: ssh deploy@prod "docker pull registry.example.com/app:latest && docker compose up -d"
        env: { AWS_ACCESS_KEY_ID: "${{ secrets.AWS_KEY }}", AWS_SECRET_ACCESS_KEY: "${{ secrets.AWS_SECRET }}" }
